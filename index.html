<style>
:root{--oak:#2a170d;--oak2:#4a2c18;--gold:#d4a84b;--gold2:#8a6a24;--parch:#eadcb4;--ink:#2b1c10;--arc:#9a78ff;--ember:#b3472b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:18px/1.45 'IM Fell English',Georgia,serif;color:var(--parch);
background:radial-gradient(ellipse at 50% -10%,#7a4e2c99,transparent 60%),radial-gradient(ellipse at 50% 120%,#000a,transparent 60%),repeating-linear-gradient(90deg,transparent 0 118px,#000a 118px 121px),repeating-linear-gradient(90deg,#ffffff06 0 37px,#0003 37px 74px,transparent 74px 111px),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 7px),linear-gradient(#3b2213,#20110a);background-attachment:fixed}
body::before{content:"";position:fixed;left:50%;top:50%;width:92vmin;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px dashed #9a78ff40;box-shadow:0 0 90px #9a78ff22,inset 0 0 90px #9a78ff22;pointer-events:none;animation:spin 140s linear infinite}
body::after{content:"";position:fixed;left:50%;top:50%;width:62vmin;aspect-ratio:1;translate:-50% -50%;border:2px double #d4a84b33;border-radius:14%;pointer-events:none;animation:spin 90s linear infinite reverse}
.wrap{position:relative;z-index:1}
h1,h2,button,select,.tag{font-family:Cinzel,Georgia,serif}
h1{font:700 clamp(28px,6vw,54px)/1.1 'Cinzel Decorative',Cinzel,serif;color:var(--gold);text-shadow:0 0 18px var(--arc),0 2px 0 #000;margin:.2em 0}
h2{font-size:21px;margin:0 0 10px;color:var(--oak2);padding-bottom:6px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--gold2),transparent) 1}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid #8a6a2477;border-radius:3px;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.panel{position:relative;background:linear-gradient(#efe3bf,#dcc994);color:var(--ink);border:3px solid var(--gold2);border-radius:6px;padding:16px;margin:16px 0;box-shadow:inset 0 0 40px #8a6a2455,0 6px 18px #000a}
.btn{cursor:pointer;color:var(--gold);font-weight:700;font-size:16px;padding:10px 18px;border-radius:4px;border:2px solid var(--gold);background:linear-gradient(#5b3820,#37200f);box-shadow:inset 0 1px 0 #fff3,0 3px 0 #000a;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--arc);outline-offset:2px}
.btn.alt{color:var(--parch);border-color:var(--ember)}
input,select{font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--gold2);border-radius:4px;background:#f6edcf;color:var(--ink);min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;cursor:pointer;border:3px solid var(--gold2);border-radius:4px;background:#2a170d;overflow:hidden;aspect-ratio:4/3;transition:box-shadow .2s,border-color .2s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.npc img{object-position:50% 0}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;background:#2a170dd9;color:var(--parch);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{position:absolute;top:4px;left:4px;width:30px;height:30px;line-height:28px;text-align:center;font-style:normal;border-radius:50%;background:#2a170dd9;color:var(--gold);border:1px solid var(--gold2)}
.tile b{position:absolute;top:4px;right:4px;width:30px;height:30px;line-height:26px;text-align:center;border-radius:50%;background:#2a170dd9;color:var(--parch);border:1px solid var(--ember)}
.tile.on{border-color:var(--arc);box-shadow:0 0 0 2px var(--arc),0 0 22px var(--arc)}
.note{font-size:15px;opacity:.85;margin:6px 0 0}
.err{color:#ffb3a0}
.panel .err{color:#8c2a12}
/* display */
#stage{position:fixed;inset:0;background:#0b0704;overflow:hidden}
#bg{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity .8s}
.idle{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .8s;background:radial-gradient(circle,#2c1f4a,#0b0704 70%)}
.sigil{position:relative;width:min(60vh,60vw);aspect-ratio:1;border-radius:50%;border:3px double var(--gold);box-shadow:0 0 50px var(--arc),inset 0 0 50px #9a78ff66;animation:spin 60s linear infinite}
.sigil::before,.sigil::after{content:"";position:absolute;inset:11%;border-radius:50%;border:2px dashed var(--arc)}
.sigil::after{inset:26%;border:3px double var(--gold);transform:rotate(45deg);border-radius:12%;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#npcs{position:absolute;left:0;right:0;bottom:3vmin;display:flex;justify-content:center;gap:2.5vmin;padding:0 6vmin;align-items:flex-end}
#npcs figure{margin:0;width:min(22vmin,200px);text-align:center;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
#stage.solo #npcs{top:0;bottom:0;align-items:center}
#stage.solo #npcs figure{width:min(58vmin,calc((100vw - 16vmin)/var(--n) - 3vmin))}
#npcs img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 0;border-radius:50%;border:5px solid var(--gold);box-shadow:0 0 0 3px var(--oak),0 8px 20px #000c}
#npcs figcaption{margin-top:6px;padding:3px 10px;font:700 clamp(14px,2.4vmin,22px) Cinzel,serif;color:var(--gold);background:linear-gradient(#4a2c18,#2a170d);border:2px solid var(--gold2);border-radius:4px}
.frame{position:absolute;inset:0;pointer-events:none;border:clamp(10px,2.2vmin,26px) solid var(--oak2);border-image:repeating-linear-gradient(90deg,#4a2c18 0 30px,#3a2012 30px 33px) 30;box-shadow:inset 0 0 0 3px var(--gold2),inset 0 0 80px #000b}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:url(board.jpg) center/cover fixed #000}
body::before,body::after{display:none}
textarea{font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--gold2);border-radius:4px;background:#f6edcf;color:var(--ink);width:100%;resize:vertical}
textarea:focus-visible{outline:3px solid var(--arc);outline-offset:2px}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h2{margin:0}
summary h2::before{content:"▸";display:inline-block;margin-right:.45em;transition:transform .2s}
details[open]>summary{margin-bottom:12px}
details[open]>summary h2::before{transform:rotate(90deg)}
.qrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px;margin:8px 0;border:2px solid var(--gold2);border-radius:4px;background:#f6edcf99}
.qrow.on{border-color:var(--arc);box-shadow:0 0 0 2px var(--arc)}
.qrow p{margin:2px 0 0;white-space:pre-wrap;font-size:16px}
.qrow .qt{flex:1 1 220px;min-width:0}
.sigil{width:98vmin;transition:opacity .8s}
#stage:not(.empty) .sigil{opacity:0}
#stage.board .frame{display:none}
#board{position:absolute;inset:0;background:url(board.jpg) center/100% 100% no-repeat;opacity:0;pointer-events:none;transition:opacity .6s}

#papers{position:absolute;inset:9vh 8vw;display:grid;grid-template-columns:repeat(var(--c,1),1fr);gap:3vmin;align-content:center;align-items:start;overflow:hidden}
.paper{position:relative;background:linear-gradient(#f4e8c6,#e2cf9c);color:#2b1c10;padding:3.4vmin 2.6vmin 2.4vmin;border-radius:2px;box-shadow:0 .6vmin 1.6vmin #000a,inset 0 0 4vmin #8a6a2455;transform:rotate(calc(var(--r)*1deg));font-size:clamp(13px,2.3vmin,26px);animation:rise .5s ease-out}
.paper h3{font:700 1.15em Cinzel,serif;margin:0 0 .4em;color:#4a2c18}
.paper p{margin:0;white-space:pre-wrap;line-height:1.35}
.pin{position:absolute;top:.8vmin;left:50%;width:2.4vmin;height:2.4vmin;margin-left:-1.2vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a85,#b3472b 60%,#5a1a0c);box-shadow:0 .4vmin .6vmin #0008}
.paper.done{opacity:.72}
.paper.done h3{text-decoration:line-through}
.paper.done::after{content:"Completed";position:absolute;right:6%;bottom:8%;transform:rotate(-12deg);font:700 1.1em Cinzel,serif;color:#8c2a12;border:3px solid #8c2a12;padding:.1em .5em;border-radius:4px}

#stage{background:#000}
#papers{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;gap:3vmin}
.paper{flex:0 0 min(calc((100% - (var(--per,1) - 1)*3vmin)/var(--per,1)),36vh);aspect-ratio:1;overflow:hidden;font-family:Caveat,'Segoe Script','Comic Sans MS',cursive;font-size:clamp(17px,3.4vmin,32px);padding:4.2vmin 2.4vmin 2vmin}
.paper h3{font:700 1.25em Caveat,'Segoe Script','Comic Sans MS',cursive;margin:0 0 .15em;color:#3a2210;line-height:1.05}
.paper p{line-height:1.1}
.paper.done::after{font:700 1.2em Caveat,cursive}
.pin{top:1vmin;width:2.8vmin;height:2.8vmin;margin-left:-1.4vmin;border-radius:48% 52% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 32% 28%,#e0a36a 0 9%,transparent 24%),radial-gradient(circle at 72% 68%,#4a2010 0 12%,transparent 34%),radial-gradient(circle,#9a5428 0 45%,#6b3416 70%,#2e160a 100%);box-shadow:.35vmin .6vmin .5vmin #0009,inset 0 0 0 .22vmin #2a140a}
#npcs figure.mon{width:min(36vmin,340px)}
#npcs figure.mon img{border-color:#b3472b;box-shadow:0 0 0 3px var(--oak),0 8px 24px #000c,0 0 40px #b3472b66}

.tile.mon{border-color:#b3472b}
.tile.mon.on{border-color:var(--arc)}

#papers{gap:2vmin}
.paper{flex:0 0 min(calc((100% - (var(--per,1) - 1)*2vmin)/var(--per,1)),var(--cap,30vh));aspect-ratio:589/700;background:url(paper.webp) center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 .5vmin .8vmin #000b);padding:17% 13% 12%;font-family:Almendra,'IM Fell English',Georgia,serif;font-size:var(--fs,2.4vmin)}
.paper h3{font:400 1.25em MedievalSharp,Almendra,Georgia,serif;color:#3a2210;margin:0 0 .3em;line-height:1.1}
.paper p{line-height:1.2}
.paper.done::after{font:400 1.2em MedievalSharp,Georgia,serif}

#mapc{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .6s}
#stage.map #mapc{opacity:1}
#mc{display:block;width:100%;aspect-ratio:16/10;max-height:70vh;background:#000;border:3px solid var(--gold2);border-radius:4px;touch-action:none}
label{font-family:Cinzel,Georgia,serif;font-size:15px}

.paper{padding:0}
.paper .in{position:absolute;inset:17% 13% 11%;overflow:hidden}
</style></head>

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let unsubs=[];

if(CFG.projectId==="PASTE"){app.innerHTML='<div class="wrap"><h1>The Arcane Table</h1><div class="panel"><h2>Firebase is not set up yet</h2><p>Open index.html and paste your Firebase web app config into the CFG object near the top of the script.</p></div></div>';throw 0}
const db=getFirestore(initializeApp(CFG));

function route(){
  unsubs.forEach(u=>u());unsubs=[];
  const [v,c]=location.hash.slice(1).split('/');

addEventListener('hashchange',route);route();

function home(){

  <p class="note">Pick any word. Every device that uses the same code sees the same table.</p>

    const code=$('#code').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
    if(!code)return $('#code').focus();

}

async function display(code){
  app.onclick=null;
  app.innerHTML='<div id="stage" class="empty"><div id="bg"></div><div class="idle" id="idle"><div class="sigil"></div></div><div id="npcs"></div><canvas id="mapc"></canvas><div id="board"><div id="papers"></div></div></div>';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  const cache=new Map();
  const get=async id=>{if(!id)return{};if(!cache.has(id)){const s=await getDoc(doc(db,'sessions',code,'images',id));cache.set(id,s.exists()?s.data():{})}return cache.get(id)};
  let d={},qs=[],seq=0;
  const cv=$('#mapc'),RM=makeRenderer(cv);let MO=null,MS={},tg=null,cur=null,raf=0,curId=null,TL=[];
  const stepM=()=>{raf=0;if(!MO||!tg)return;if(!cur)cur={...tg};const k=.25;cur.x+=(tg.x-cur.x)*k;cur.y+=(tg.y-cur.y)*k;cur.ft+=(tg.ft-cur.ft)*k;RM(MO,MS,cur,1,mkToks(TL,MS));
    if(Math.abs(tg.x-cur.x)>2e-4||Math.abs(tg.y-cur.y)>2e-4||Math.abs(tg.ft-cur.ft)>.02)raf=requestAnimationFrame(stepM)};

  unsubs.push(onSnapshot(collection(db,'sessions',code,'quests'),s=>{qs=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.created-b.created);paint()}));
}

const mapCache=new Map();
function loadMap(code,id){
  if(!mapCache.has(id))mapCache.set(id,(async()=>{
    const m=(await getDoc(doc(db,'sessions',code,'images',id))).data();if(!m)return null;
    const c=document.createElement('canvas');c.width=m.w;c.height=m.h;
    const x=c.getContext('2d'),tw=Math.ceil(m.w/m.cols),th=Math.ceil(m.h/m.rows);
    await Promise.all(Array.from({length:m.cols*m.rows},async(_,i)=>{
      const t=(await getDoc(doc(db,'sessions',code,'images',id,'tiles',String(i)))).data();if(!t)return;
      const im=new Image();im.src=t.data;await im.decode();x.drawImage(im,(i%m.cols)*tw,Math.floor(i/m.cols)*th)}));
    return{meta:m,canvas:c};
  })().catch(e=>{mapCache.delete(id);throw e}));

}
function watchMap(code,cb){
  let id=null,unsub=null,MO=null,MS={};
  return{
    set(nid){if(nid===id)return;unsub&&unsub();unsub=null;id=nid;MO=null;MS={};cb(MO,MS);if(!nid)return;

    stop(){unsub&&unsub()},
    get id(){return id}};

const tokCache=new Map();
function tokImg(id,data,cb){let im=tokCache.get(id);if(!im){im=new Image();im.onload=cb;im.src=data;tokCache.set(id,im)}return im}
const tokPos=(MS,id,i)=>{const p=MS.tk&&MS.tk[id];if(p)return p;const l=(MS.lights||[{x:.5,y:.5}])[0];return{x:l.x+i*.012,y:l.y+i*.012}};
const mkToks=(TL,MS)=>TL.map((t,i)=>({...t,...tokPos(MS,t.id,i)}));
const tokDia=(t,W,pxft,sc)=>Math.max(W*.035*(t.mon?1.4:1),(t.mon?10:5)*pxft*sc);
function drawToks(c,toks,ox,oy,mw,mh,pxft,sc,R,Ls,mode){
  toks.forEach(t=>{
    const im=t.im;if(!im||!im.complete||!im.naturalWidth)return;
    const x=ox+t.x*mw,y=oy+t.y*mh,d=tokDia(t,c.canvas.width,pxft,sc),r=d/2;
    let f=1;if(mode!=='rev'){f=0;Ls.forEach(l=>{const u=Math.hypot(x-(ox+l.x*mw),y-(oy+l.y*mh))/R;f=Math.max(f,Math.min(1,Math.max(0,(1-u)/.45)))})}

    c.save();c.globalAlpha=a;c.beginPath();c.arc(x,y,r,0,7);c.clip();c.drawImage(im,sx,0,s,s,x-r,y-r,d,d);c.restore();
    c.save();c.globalAlpha=a;c.beginPath();c.arc(x,y,r,0,7);c.lineWidth=Math.max(2,r*.12);c.strokeStyle=t.mon?'#b3472b':'#d4a84b';c.stroke();c.restore();
  });
}
function makeRenderer(cv){
  const ctx=cv.getContext('2d'),fog=document.createElement('canvas'),fx=fog.getContext('2d'),ex=document.createElement('canvas'),ec=ex.getContext('2d');

    const lf=MS.lft||30,R=lf*pxft*sc,es=Math.min(1,1024/Math.max(m.w,m.h));
    if(MO!==last){last=MO;key=''}
    const k=[MS.sq,lf,MS.ex].join('|');
    if(k!==key){key=k;ex.width=Math.round(m.w*es);ex.height=Math.round(m.h*es);
      (MS.ex||'').split(';').filter(Boolean).forEach(p=>{const[a,b]=p.split(',');soft(ec,a*ex.width,b*ex.height,lf*pxft*es,'rgba(255,255,255,')})}
    if(fog.width!==W||fog.height!==H){fog.width=W;fog.height=H}

}
async function prepMap(file){
  const bm=await createImageBitmap(file),r=Math.min(1,3200/Math.max(bm.width,bm.height));
  const w=Math.round(bm.width*r),h=Math.round(bm.height*r),cols=Math.ceil(w/1600),rows=Math.ceil(h/1600),tw=Math.ceil(w/cols),th=Math.ceil(h/rows);
  const full=document.createElement('canvas');full.width=w;full.height=h;full.getContext('2d').drawImage(bm,0,0,w,h);
  const tiles=[];
  for(let i=0;i<cols*rows;i++){
    const c=document.createElement('canvas');c.width=tw;c.height=th;
    c.getContext('2d').drawImage(full,(i%cols)*tw,Math.floor(i/cols)*th,tw,th,0,0,tw,th);
    let q=.8,u;do{u=c.toDataURL('image/webp',q);q-=.1}while(u.length>900000&&q>.2);
    if(u.length>1000000)throw new Error('A map part is too detailed to store. Try a smaller image.');
    tiles.push(u);
  }
  const t=document.createElement('canvas'),tr=Math.min(1,400/Math.max(w,h));t.width=Math.round(w*tr);t.height=Math.round(h*tr);
  t.getContext('2d').drawImage(full,0,0,t.width,t.height);
  return{w,h,cols,rows,tiles,thumb:t.toDataURL('image/webp',.7)};
}

async function shrink(file,max){
  const bm=await createImageBitmap(file),r=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  let q=.85,u;do{u=c.toDataURL('image/webp',q);q-=.1}while(u.length>880000&&q>.2);
  if(u.length>1000000)throw new Error('Image is too large even after shrinking.');
  return u;
}
