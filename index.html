<style>
:root{--oak:#2a170d;--oak2:#4a2c18;--gold:#d4a84b;--gold2:#8a6a24;--parch:#eadcb4;--ink:#2b1c10;--arc:#9a78ff;--hl:#f0a93a;--ember:#b3472b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:18px/1.45 'IM Fell English',Georgia,serif;color:var(--parch);
background:radial-gradient(ellipse at 50% -10%,#7a4e2c99,transparent 60%),radial-gradient(ellipse at 50% 120%,#000a,transparent 60%),repeating-linear-gradient(90deg,transparent 0 118px,#000a 118px 121px),repeating-linear-gradient(90deg,#ffffff06 0 37px,#0003 37px 74px,transparent 74px 111px),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 7px),linear-gradient(#3b2213,#20110a);background-attachment:fixed}
.wrap{position:relative;z-index:1}
h1,h2,button,select,.tag{font-family:Cinzel,Georgia,serif}
h1{font:700 clamp(28px,6vw,54px)/1.1 'Cinzel Decorative',Cinzel,serif;color:var(--gold);text-shadow:0 0 18px #f0a93a99,0 2px 0 #000;margin:.2em 0}
h2{font-size:21px;margin:0 0 10px;color:var(--oak2);padding-bottom:6px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--gold2),transparent) 1}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid #8a6a2477;border-radius:3px;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.panel{position:relative;background:linear-gradient(#efe3bf,#dcc994);color:var(--ink);border:3px solid var(--gold2);border-radius:6px;padding:16px;margin:16px 0;box-shadow:inset 0 0 40px #8a6a2455,0 6px 18px #000a}
.btn{cursor:pointer;color:var(--gold);font-weight:700;font-size:16px;padding:10px 18px;border-radius:4px;border:2px solid var(--gold);background:linear-gradient(#5b3820,#37200f);box-shadow:inset 0 1px 0 #fff3,0 3px 0 #000a;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.btn.alt{color:var(--parch);border-color:var(--ember)}
input,select{font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--gold2);border-radius:4px;background:#f6edcf;color:var(--ink);min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;cursor:pointer;border:3px solid var(--gold2);border-radius:4px;background:#2a170d;overflow:hidden;aspect-ratio:4/3;transition:box-shadow .2s,border-color .2s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.npc img{object-position:50% 0}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;background:#2a170dd9;color:var(--parch);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{position:absolute;top:4px;left:4px;width:30px;height:30px;line-height:28px;text-align:center;font-style:normal;border-radius:50%;background:#2a170dd9;color:var(--gold);border:1px solid var(--gold2)}
.tile b{position:absolute;top:4px;right:4px;width:30px;height:30px;line-height:26px;text-align:center;border-radius:50%;background:#2a170dd9;color:var(--parch);border:1px solid var(--ember)}
.tile.on{border-color:var(--hl);box-shadow:0 0 0 2px var(--hl),0 0 18px #f0a93a88}
.note{font-size:15px;opacity:.85;margin:6px 0 0}
.err{color:#ffb3a0}
.panel .err{color:#8c2a12}
/* display */
#stage{position:fixed;inset:0;background:#0b0704;overflow:hidden}
#bg{position:absolute;inset:0;background:center/100% 100% no-repeat;transition:opacity .8s}
.idle{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .8s;background:radial-gradient(circle,#2c1f4a,#0b0704 70%)}
.sigil{position:relative;width:min(60vh,60vw);aspect-ratio:1;border-radius:50%;border:3px double var(--gold);box-shadow:0 0 50px var(--arc),inset 0 0 50px #9a78ff66;animation:spin 60s linear infinite}
.sigil::before,.sigil::after{content:"";position:absolute;inset:11%;border-radius:50%;border:2px dashed var(--arc)}
.sigil::after{inset:26%;border:3px double var(--gold);transform:rotate(45deg);border-radius:12%;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#npcs{position:absolute;left:0;right:0;bottom:3vmin;display:flex;justify-content:center;gap:2.5vmin;padding:0 6vmin;align-items:flex-end}
#npcs figure{margin:0;width:min(22vmin,200px);text-align:center;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
#stage.solo #npcs{top:0;bottom:0;align-items:center}
#stage.solo #npcs figure{width:min(58vmin,calc((100vw - 16vmin)/var(--n) - 3vmin))}
#npcs img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 0;border-radius:50%;border:5px solid var(--gold);box-shadow:0 0 0 3px var(--oak),0 8px 20px #000c}
#npcs figcaption{margin-top:6px;padding:3px 10px;font:700 clamp(14px,2.4vmin,22px) Cinzel,serif;color:var(--gold);background:linear-gradient(#4a2c18,#2a170d);border:2px solid var(--gold2);border-radius:4px}
.frame{position:absolute;inset:0;pointer-events:none;border:clamp(10px,2.2vmin,26px) solid var(--oak2);border-image:repeating-linear-gradient(90deg,#4a2c18 0 30px,#3a2012 30px 33px) 30;box-shadow:inset 0 0 0 3px var(--gold2),inset 0 0 80px #000b}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:#000}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(board.jpg) center/100% 100% no-repeat}

.sigil{width:98vmin;transition:opacity .8s}
#stage:not(.empty) .sigil{opacity:0}
#stage.board .frame{display:none}
#board{position:absolute;inset:0;background:url(board.jpg) center/100% 100% no-repeat;opacity:0;pointer-events:none;transition:opacity .6s}

#papers{position:absolute;inset:9vh 8vw;display:grid;grid-template-columns:repeat(var(--c,1),1fr);gap:3vmin;align-content:center;align-items:start;overflow:hidden}
.paper{position:relative;background:linear-gradient(#f4e8c6,#e2cf9c);color:#2b1c10;padding:3.4vmin 2.6vmin 2.4vmin;border-radius:2px;box-shadow:0 .6vmin 1.6vmin #000a,inset 0 0 4vmin #8a6a2455;transform:rotate(calc(var(--r)*1deg));font-size:clamp(13px,2.3vmin,26px);animation:rise .5s ease-out}
.paper h3{font:700 1.15em Cinzel,serif;margin:0 0 .4em;color:#4a2c18}
.paper p{margin:0;white-space:pre-wrap;line-height:1.35}
.pin{position:absolute;top:.8vmin;left:50%;width:2.4vmin;height:2.4vmin;margin-left:-1.2vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a85,#b3472b 60%,#5a1a0c);box-shadow:0 .4vmin .6vmin #0008}
.paper.done{opacity:.72}
.paper.done h3{text-decoration:line-through}
.paper.done::after{content:"Completed";position:absolute;right:6%;bottom:8%;transform:rotate(-12deg);font:700 1.1em Cinzel,serif;color:#8c2a12;border:3px solid #8c2a12;padding:.1em .5em;border-radius:4px}

#stage{background:#000}
#papers{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;gap:3vmin}
.paper{flex:0 0 min(calc((100% - (var(--per,1) - 1)*3vmin)/var(--per,1)),36vh);aspect-ratio:1;overflow:hidden;font-family:Caveat,'Segoe Script','Comic Sans MS',cursive;font-size:clamp(17px,3.4vmin,32px);padding:4.2vmin 2.4vmin 2vmin}

#papers{gap:2vmin}

    if(a==='shpl'){const sh=shops.find(x=>x.id===id);if(sh){const k=(sh._r||code)+':'+sh.id;set({pshops:(live.pshops||[]).includes(k)?arrayRemove(k):arrayUnion(k)})}}
    if(a==='shren'){const sh=shops.find(x=>x.id===selShop),nn=sh&&prompt('Shop name',sh.name);if(nn&&nn.trim())updateDoc(doc(db,'sessions',sh._r||code,'shops',selShop),{name:nn.trim()})}
    if(a==='shdel'&&selShop&&confirm((shops.find(x=>x.id===selShop)||{})._r==='_shared'?'Delete this shared shop and all its items for every session?':'Delete this shop and all its items?')){const sd=selShop,rt=(shops.find(x=>x.id===sd)||{})._r||code;
      for(const i of items.filter(x=>x.shopId===sd)){await deleteDoc(doc(db,'sessions',rt,'items',i.id));await deleteDoc(doc(db,'sessions',rt,'notes',i.id))}
      await deleteDoc(doc(db,'sessions',rt,'shops',sd));set({pshops:arrayRemove(rt+':'+sd)});if(live.shopId===sd)set({showShop:false,shopItemId:null});selShop=null;localStorage.removeItem('selShop');draw()}
    if(a==='itsave'){
      const msg=$('#itm'),name=$('#itn').value.trim();
      if(!selShop){msg.className='note err';msg.textContent='Select or add a shop first.';return}
      if(!name){msg.className='note err';msg.textContent='Give the item a name.';return}
      try{msg.className='note';msg.textContent='Saving...';
        const f=$('#iti').files[0],img=f?await shrink(f,480):null,body={name,cost:$('#itc').value.trim(),desc:$('#itd').value.trim(),rules:$('#itr').value.trim(),weight:$('#itw').value.trim(),...(img?{img}:{})};
        const rt=editIt?((items.find(x=>x.id===editIt)||{})._r||code):((shops.find(x=>x.id===selShop)||{})._r||code),nid=editIt||doc(collection(db,'sessions',rt,'items')).id;
        if(editIt)await updateDoc(doc(db,'sessions',rt,'items',nid),body);
        else await setDoc(doc(db,'sessions',rt,'items',nid),{shopId:selShop,img:'',created:Date.now(),...body});
        await setDoc(doc(db,'sessions',rt,'notes',nid),{text:$('#itx').value.trim()});
        editIt=null;['#itn','#itc','#itw','#itd','#itr','#itx','#iti'].forEach(k=>$(k).value='');$('#itb').textContent='Add item';msg.textContent='Saved.';
      }catch(err){msg.className='note err';msg.textContent='Could not save: '+err.message}}
    if(a==='itedit'){const i=items.find(x=>x.id===id);if(i){editIt=id;$('#itn').value=i.name||'';$('#itc').value=i.cost||'';$('#itd').value=i.desc||'';$('#itr').value=i.rules||'';$('#itw').value=i.weight||'';$('#itx').value=NT[id]||'';$('#itb').textContent='Save item';$('#itn').focus()}}
    if(a==='itdel'&&confirm('Delete this item?')){if(editIt===id){editIt=null;$('#itb').textContent='Add item'}const rt=(items.find(x=>x.id===id)||{})._r||code;deleteDoc(doc(db,'sessions',rt,'items',id));deleteDoc(doc(db,'sessions',rt,'notes',id))}
    if(a==='imp'){
      const msg=$('#imm'),sh=shops.find(x=>x.id===selShop);
      if(!sh){msg.className='note err';msg.textContent='Select a shop first.';return}
      let rows=parseTSV($('#imt').value);if(rows.length&&/^(title|name)$/i.test(rows[0][0].trim()))rows=rows.slice(1);
      if(!rows.length){msg.className='note err';msg.textContent='Nothing to import.';return}
      msg.className='note';msg.textContent='Importing...';let add=0,upd=0;
      try{for(const r of rows){const name=(r[0]||'').trim();if(!name)continue;
          const body={name,cost:(r[1]||'').trim(),weight:(r[2]||'').trim(),desc:(r[3]||'').trim(),rules:(r[4]||'').trim()},note=(r[5]||'').trim();
          const ex=items.find(i=>i.shopId===sh.id&&(i.name||'').trim().toLowerCase()===name.toLowerCase());
          let nid;if(ex){nid=ex.id;await updateDoc(doc(db,'sessions',sh._r,'items',nid),body);upd++}
          else{nid=doc(collection(db,'sessions',sh._r,'items')).id;await setDoc(doc(db,'sessions',sh._r,'items',nid),{shopId:sh.id,img:'',created:Date.now()+add,...body});add++}
          if(note)await setDoc(doc(db,'sessions',sh._r,'notes',nid),{text:note})}
        $('#imt').value='';msg.textContent='Imported: '+add+' new, '+upd+' updated.';
      }catch(err){msg.className='note err';msg.textContent='Import failed: '+err.message}}
    if(a==='impf'){
      const f=$('#imf').files[0],msg=$('#imm');if(!f){msg.className='note err';msg.textContent='Choose a file first.';return}
      try{
        const txt=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
        const arr=JSON.parse(txt);if(!Array.isArray(arr))throw new Error('Expected a list of items');
        msg.className='note';msg.textContent='Importing...';let add=0,upd=0,ns=0;
        const names=[...new Set(arr.map(x=>(x.shop||'Imported').trim()))],map={};
        for(const nm of names){let sh=shops.find(x=>x._r==='_shared'&&(x.name||'').trim().toLowerCase()===nm.toLowerCase());
          if(!sh){const r=doc(collection(db,'sessions','_shared','shops'));await setDoc(r,{name:nm,created:Date.now()+ns});sh={id:r.id};ns++}
          map[nm]=sh}
        for(const x of arr){const sh=map[(x.shop||'Imported').trim()],name=(x.name||'').trim();if(!name)continue;
          const body={name,cost:x.cost||'',weight:x.weight||'',desc:x.description||x.desc||'',rules:x.rules||''};
          const ex=items.find(i=>i._r==='_shared'&&i.shopId===sh.id&&(i.name||'').trim().toLowerCase()===name.toLowerCase());let nid;
          if(ex){nid=ex.id;await updateDoc(doc(db,'sessions','_shared','items',nid),body);upd++}
          else{nid=doc(collection(db,'sessions','_shared','items')).id;await setDoc(doc(db,'sessions','_shared','items',nid),{shopId:sh.id,img:'',created:Date.now()+add,...body});add++}
          if(x.dmNote)await setDoc(doc(db,'sessions','_shared','notes',nid),{text:String(x.dmNote)})}
        $('#imf').value='';msg.textContent='Imported '+names.length+' shops: '+add+' new items, '+upd+' updated.';
      }catch(err){msg.className='note err';msg.textContent='Import failed: '+err.message}}
    if(a==='exp'){
      const sh=shops.find(x=>x.id===selShop),msg=$('#imm');if(!sh)return;
      const q=v=>/[\t\n\r"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
      const t=['Name\tCost\tWeight\tDescription\tStatblock\tDM notes',...items.filter(i=>i.shopId===sh.id).map(i=>[i.name,i.cost,i.weight,i.desc,i.rules,NT[i.id]].map(v=>q(v||'')).join('\t'))].join('\n');
      try{await navigator.clipboard.writeText(t);msg.className='note';msg.textContent='Copied '+(t.split('\n').length-1)+' items. Paste them into your sheet.'}
      catch(e){$('#imt').value=t;msg.className='note';msg.textContent='Clipboard blocked. The table is in the box above.'}}
    if(a==='itshow'){const i=items.find(x=>x.id===id);if(i){const on=live.showShop&&live.shopId===i.shopId;set(on?{shopItemId:live.shopItemId===id?null:id}:{showShop:true,shopId:i.shopId,shopRoot:i._r,shopItemId:id,showBoard:false,showMap:false})}}
    if(a==='map'){autoMusic(id);autoCard(id);set({mapId:id,mapWx:wxOf(id),mapView:{x:.5,y:.5,ft:60}})}
    if(a==='mshow'&&live.mapId)set({showMap:!live.showMap,...(!live.showMap?{showBoard:false,showShop:false}:{})});
    if(a==='mlight'&&MO){const L=lights().map(l=>({...l})),n={x:view.x,y:view.y};L.push(n);MS.lights=L;addEx(n);dirty=true;flush();drawMap()}
    if(a==='mrm'&&MO&&lights().length>1){MS.lights=lights().slice(0,-1);dirty=true;flush();drawMap()}
    if(a==='mreset'&&MO){MS.lights=lights();MS.ex='';MS.lights.forEach(addEx);dirty=true;flush();drawMap()}
    if(a==='board')set({showBoard:!live.showBoard,...(!live.showBoard?{showMap:false,showShop:false}:{})});
    if(a==='home'){location.hash='';}
    if(a==='ren'){const cur=imgs.find(x=>x.id===id),nn=prompt('New name',cur?cur.name:'');if(nn&&nn.trim())updateDoc(doc(IM,id),{name:nn.trim()})}
    if(a==='del'&&confirm('Delete this image from the library?')){
      const im=imgs.find(x=>x.id===id);
      if(im&&im.type==='map'){for(let k=0;k<im.cols*im.rows;k++)await deleteDoc(doc(db,'sessions',code,'images',id,'tiles',String(k)));await deleteDoc(doc(db,'sessions',code,'maps',id));mapCache.delete(id)}
      await set({visibleNpcIds:arrayRemove(id),...(live.backgroundId===id?{backgroundId:null}:{}),...(live.mapId===id?{mapId:null,showMap:false}:{})});
      await deleteDoc(doc(IM,id));}
    if(a==='qsave'){
      const title=$('#qt').value.trim(),text=$('#qx').value.trim();if(!title&&!text)return;
      if(edit){await updateDoc(doc(QC,edit),{title,text});edit=null}
      else await setDoc(doc(QC),{title,text,posted:true,done:false,created:Date.now()});
      $('#qt').value='';$('#qx').value='';$('#qb').textContent='Add quest';}
    if(a==='qpin'||a==='qdone'){const q=qs.find(x=>x.id===id);if(q)updateDoc(doc(QC,id),a==='qpin'?{posted:!q.posted}:{done:!q.done})}
    if(a==='qedit'){const q=qs.find(x=>x.id===id);if(q){edit=id;$('#qt').value=q.title||'';$('#qx').value=q.text||'';$('#qb').textContent='Save quest';$('#qt').focus()}}
    if(a==='qdel'&&confirm('Delete this quest?')){deleteDoc(doc(QC,id));if(live.curQuest===id)set({curQuest:null})}
    if(a==='qcur')set({curQuest:live.curQuest===id?null:id});
    if(a==='up'){
      const files=[...$('#file').files],type=$('#type').value,msg=$('#msg');
      if(!files.length){msg.className='note err';msg.textContent='Choose at least one image first.';return}
      for(const f of files){
        try{msg.className='note';msg.textContent='Preparing '+f.name+'...';
          if(type==='map'){const nm0=(files.length===1&&$('#nm').value.trim())||f.name.replace(/\.[^.]+$/,'');const M=await prepMap(f),ref=doc(IM);
            for(let i=0;i<M.tiles.length;i++){msg.textContent='Saving map part '+(i+1)+' of '+M.tiles.length+'...';await setDoc(doc(db,'sessions',code,'images',ref.id,'tiles',String(i)),{data:M.tiles[i]})}
            await setDoc(ref,{name:nm0,type:'map',data:M.thumb,w:M.w,h:M.h,cols:M.cols,rows:M.rows,created:Date.now()});msg.textContent='Added '+nm0+'.';continue}
          const data=await shrink(f,type==='background'?1920:type==='monster'?900:640);
          const name=(files.length===1&&$('#nm').value.trim())||f.name.replace(/\.[^.]+$/,'');
          await setDoc(doc(IM),{name,type,data,created:Date.now()});
          msg.textContent='Added '+name+'.';
        }catch(err){msg.className='note err';msg.textContent='Could not add '+f.name+': '+err.message;return}}
      $('#file').value='';$('#nm').value='';}
  };
}
addEventListener('hashchange',route);route();
</script></body></html>
