    if(a==='shren'){const sh=shops.find(x=>x.id===selShop),nn=sh&&prompt('Shop name',sh.name);if(nn&&nn.trim())updateDoc(doc(db,'sessions',sh._r||code,'shops',selShop),{name:nn.trim()})}
    if(a==='shdel'&&selShop&&confirm((shops.find(x=>x.id===selShop)||{})._r==='_shared'?'Delete this shared shop and all its items for every session?':'Delete this shop and all its items?')){const sd=selShop,rt=(shops.find(x=>x.id===sd)||{})._r||code;

    if(a==='itedit'){const i=items.find(x=>x.id===id);if(i){editIt=id;$('#itn').value=i.name||'';$('#itc').value=i.cost||'';$('#itd').value=i.desc||'';$('#itr').value=i.rules||'';$('#itw').value=i.weight||'';$('#its').value=i.slots!=null?i.slots:'';$('#its').placeholder='auto: '+slotFmt(slotsOf({name:i.name,weight:i.weight}));$('#itu').value=i.uses!=null?i.uses:'';$('#itk').value=i.cat||'';$('#ita').value=i.actionType||'none';$('#itt').value=i.useText||'';$('#itx').value=NT[id]||'';$('#itb').textContent='Save item';placeForm();$('#itn').focus({preventScroll:true});$('#shform').scrollIntoView({block:'nearest'})}}
    if(a==='itcancel'){editIt=null;clearForm();placeForm();$('#itm').textContent=''}
    if(a==='itdel'&&confirm('Delete this item?')){if(editIt===id){editIt=null;clearForm();placeForm()}const rt=(items.find(x=>x.id===id)||{})._r||code;deleteDoc(doc(db,'sessions',rt,'items',id));deleteDoc(doc(db,'sessions',rt,'notes',id))}
    if(a==='imp'){
      const msg=$('#imm'),sh=shops.find(x=>x.id===selShop);

      if(!rows.length){msg.className='note err';msg.textContent='Nothing to import.';return}
      msg.className='note';msg.textContent='Importing...';let add=0,upd=0;
      try{for(const r of rows){const name=(r[0]||'').trim();if(!name)continue;
          const body={name,cost:(r[1]||'').trim(),weight:(r[2]||'').trim(),desc:(r[3]||'').trim(),rules:(r[4]||'').trim()},note=(r[5]||'').trim();
          const ex=items.find(i=>i.shopId===sh.id&&(i.name||'').trim().toLowerCase()===name.toLowerCase());

          else{nid=doc(collection(db,'sessions',sh._r,'items')).id;await setDoc(doc(db,'sessions',sh._r,'items',nid),{shopId:sh.id,img:'',created:Date.now()+add,...body});add++}
          if(note)await setDoc(doc(db,'sessions',sh._r,'notes',nid),{text:note})}
        $('#imt').value='';msg.textContent='Imported: '+add+' new, '+upd+' updated.';
      }catch(err){msg.className='note err';msg.textContent='Import failed: '+err.message}}
    if(a==='impf'){
      const f=$('#imf').files[0],msg=$('#imm');if(!f){msg.className='note err';msg.textContent='Choose a file first.';return}
      try{
        const txt=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
        const arr=JSON.parse(txt);if(!Array.isArray(arr))throw new Error('Expected a list of items');
        const repl=$('#imr').checked;if(repl&&!confirm('Delete all items in the shops of this file and import them fresh?'))return;
        msg.className='note';msg.textContent='Importing...';let add=0,upd=0,ns=0,del=0;
        const names=[...new Set(arr.map(x=>(x.shop||'Imported').trim()))],map={};

          map[nm]=sh}
        if(repl)for(const sh of Object.values(map))for(const i of items.filter(x=>x._r==='_shared'&&x.shopId===sh.id)){await deleteDoc(doc(db,'sessions','_shared','items',i.id));await deleteDoc(doc(db,'sessions','_shared','notes',i.id));del++}
        for(const x of arr){const sh=map[(x.shop||'Imported').trim()],name=(x.name||'').trim();if(!name)continue;
          const num=(v,mx,f)=>v==null||v===''?null:Math.max(0,Math.min(mx,f(v))),body={name,cost:x.cost||'',weight:x.weight||'',desc:x.description||x.desc||'',rules:x.rules||'',slots:num(x.slots,4,v=>Math.round((parseFloat(v)||0)*2)/2),uses:num(x.uses,99,v=>parseInt(v)||0),cat:x.cat||'',actionType:x.actionType||'none',useText:x.useText||''};
          const ex=!repl&&items.find(i=>i._r==='_shared'&&i.shopId===sh.id&&(i.name||'').trim().toLowerCase()===name.toLowerCase());let nid;
          if(ex){nid=ex.id;await updateDoc(doc(db,'sessions','_shared','items',nid),body);upd++}
          else{nid=doc(collection(db,'sessions','_shared','items')).id;await setDoc(doc(db,'sessions','_shared','items',nid),{shopId:sh.id,img:'',created:Date.now()+add,qty:x.stock!=null?Math.max(0,parseInt(x.stock)||0):null,...body});add++}
          if(x.dmNote)await setDoc(doc(db,'sessions','_shared','notes',nid),{text:String(x.dmNote)})}
        $('#imf').value='';msg.textContent='Imported '+names.length+' shops: '+add+' new items, '+upd+' updated'+(del?', '+del+' removed':'')+'.';
      }catch(err){msg.className='note err';msg.textContent='Import failed: '+err.message}}
    if(a==='exp'){
      const sh=shops.find(x=>x.id===selShop),msg=$('#imm');if(!sh)return;
      const q=v=>/[\t\n\r"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
      const t=['Name\tCost\tWeight\tDescription\tStatblock\tDM notes',...items.filter(i=>i.shopId===sh.id).map(i=>[i.name,i.cost,i.weight,i.desc,i.rules,NT[i.id]].map(v=>q(v||'')).join('\t'))].join('\n');
      try{await navigator.clipboard.writeText(t);msg.className='note';msg.textContent='Copied '+(t.split('\n').length-1)+' items. Paste them into your sheet.'}
      catch(e){$('#imt').value=t;msg.className='note';msg.textContent='Clipboard blocked. The table is in the box above.'}}
    if(a==='qtyp'||a==='qtym'){const i=items.find(x=>x.id===id);if(i){const n=Math.max(0,(i.qty==null?0:+i.qty)+(a==='qtyp'?1:-1));i.qty=n;updateDoc(doc(db,'sessions',i._r||code,'items',id),{qty:n});draw()}}
